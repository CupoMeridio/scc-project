server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers per contenuti web statici (nessuna dipendenza CDN esterna)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        # Il portale statico risponde solo a GET/HEAD: PUT, POST, PATCH, DELETE -> 405.
        # 405 (Method Not Allowed) invece di 403 (deny) per semantica HTTP corretta.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        try_files $uri $uri/ =404;
    }
}
