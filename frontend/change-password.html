<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cambio password — Sistema Monitoraggio Diabete T1D</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="login-shell">
    <div class="card login-card">
      <h2>Cambio password obbligatorio</h2>
      <p class="muted">La tua password attuale è temporanea. Imposta una nuova password personale per proseguire.</p>

      <form id="changePasswordForm">
        <div class="form-row">
          <label for="oldPassword">Password attuale</label>
          <input id="oldPassword" name="oldPassword" type="password" autocomplete="current-password" required placeholder="Password temporanea" />
        </div>
        <div class="form-row">
          <label for="newPassword">Nuova password</label>
          <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required minlength="8" placeholder="Almeno 8 caratteri" />
        </div>
        <div class="form-row">
          <label for="confirmPassword">Conferma nuova password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" placeholder="Ripeti la nuova password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Aggiorna password</button>
      </form>

      <div id="changePasswordError" class="banner banner-red hidden"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/change-password.js"></script>
</body>
</html>
