# FILE: k8s/saas-service.yaml
# RUOLO: ClusterIP interno per il Backend SaaS (raggiunto da NGINX Ingress su /api).

apiVersion: v1
kind: Service
metadata:
  name: diabetes-saas-service
  namespace: default
  labels:
    app: diabetes-saas-api
spec:
  type: ClusterIP
  selector:
    app: diabetes-saas-api
  ports:
    - name: http
      port: 80
      targetPort: 8001
      protocol: TCP
