# FILE: k8s/ingestion-worker-deployment.yaml
# RUOLO: Worker asincroni dedicati che svuotano la coda Redis TLS CGM verso PostgreSQL HA (2 repliche).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: diabetes-ingestion-worker
  namespace: default
  labels:
    app: diabetes-ingestion-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: diabetes-ingestion-worker
  template:
    metadata:
      labels:
        app: diabetes-ingestion-worker
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - diabetes-ingestion-worker
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: diabetes-saas-api:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "saas_app.worker"]
          env:
            - name: SAAS_ENV
              value: "production"
            - name: REDIS_CA_CERT_PATH
              value: "/etc/internal-ca/ca.crt"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: worker-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: worker-secrets
                  key: REDIS_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: internal-ca
              mountPath: /etc/internal-ca
              readOnly: true
            - name: pg-ca
              mountPath: /etc/pg-ca
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "300m"
              memory: "192Mi"
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -f /tmp/cgm-worker-alive && find /tmp/cgm-worker-alive -mmin -2 | grep -q ."]
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -f /tmp/cgm-worker-alive && find /tmp/cgm-worker-alive -mmin -5 | grep -q ."]
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: internal-ca
          configMap:
            name: internal-ca
        - name: pg-ca
          secret:
            secretName: diabetes-pg-ca
            items:
              - key: ca.crt
                path: ca.crt
