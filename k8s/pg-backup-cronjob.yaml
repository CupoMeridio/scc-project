# FILE: k8s/pg-backup-cronjob.yaml
# RUOLO: Backup giornaliero cifrato autenticato (X25519 + HKDF-SHA256 + AES-256-GCM, V6).
#        Il cluster contiene SOLO la chiave pubblica (`pg-backup-public`): nessun pod compromesso
#        può decifrare i backup e qualsiasi manomissione fallisce il tag GCM in decifratura.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-backups
  namespace: default
  labels:
    app: diabetes-pg-backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: diabetes-pg-backup
  namespace: default
  labels:
    app: diabetes-pg-backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: diabetes-pg-backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: pgdump
              image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
              command:
                - sh
                - -c
                - |
                  set -eu
                  PGPASSWORD="$PG_PASSWORD" PGSSLMODE="verify-full" PGSSLROOTCERT="/etc/pg-ca/ca.crt" \
                    pg_dump -h diabetes-pg-rw -p 5432 -U saas_migrator -d diabetes_saas \
                    -Fc -f /work/raw.dump
              env:
                - name: PG_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: migrator-secrets
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: work-volume
                  mountPath: /work
                - name: pg-ca
                  mountPath: /etc/pg-ca
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "250m"
                  memory: "192Mi"
          containers:
            - name: encrypt-backup
              image: diabetes-saas-api:1.0.0
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - |
                  set -eu
                  OUT="/backups/diabetes_saas_$(date -u +%Y%m%dT%H%M%SZ).dump.enc"
                  python3 -m saas_app.backup_crypto seal --in /work/raw.dump --out "$OUT"
                  rm -f /work/raw.dump
                  echo "[✓] Backup cifrato autenticato scritto: $OUT"
                  find /backups -name '*.dump.enc' -mtime +7 -delete
              env:
                - name: BACKUP_PUBLIC_KEY_B64
                  valueFrom:
                    configMapKeyRef:
                      name: pg-backup-public
                      key: BACKUP_PUBLIC_KEY_B64
              volumeMounts:
                - name: work-volume
                  mountPath: /work
                - name: backups
                  mountPath: /backups
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "250m"
                  memory: "192Mi"
          volumes:
            - name: work-volume
              emptyDir:
                medium: Memory
                sizeLimit: 256Mi
            - name: backups
              persistentVolumeClaim:
                claimName: pg-backups
            - name: pg-ca
              secret:
                secretName: diabetes-pg-ca
                items:
                  - key: ca.crt
                    path: ca.crt
