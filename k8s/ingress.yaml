# FILE: k8s/ingress.yaml
# RUOLO: Gateway NGINX Ingress separato per zona con TLS end-to-end verso le API (/api/* -> HTTPS:443).
# NOTE: Zero snippet-annotations (P3 / CVE-2021-25742), /api/cgm/ingest mai esposto sull'Ingress (D2).

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: diabetes-api-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/limit-rps: "1000"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "150"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "10"
    nginx.ingress.kubernetes.io/server-tokens: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - localhost
      secretName: diabetes-tls-cert
  rules:
    - http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: diabetes-iam-service
                port:
                  number: 443
          - path: /api/patient
            pathType: Prefix
            backend:
              service:
                name: diabetes-clinical-service
                port:
                  number: 443
          - path: /api/doctor
            pathType: Prefix
            backend:
              service:
                name: diabetes-clinical-service
                port:
                  number: 443
          - path: /api/manager
            pathType: Prefix
            backend:
              service:
                name: diabetes-manager-service
                port:
                  number: 443
          - path: /api/health
            pathType: Exact
            backend:
              service:
                name: diabetes-iam-service
                port:
                  number: 443
          - path: /api/ready
            pathType: Exact
            backend:
              service:
                name: diabetes-iam-service
                port:
                  number: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: diabetes-forecasting-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "1000"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "150"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/server-tokens: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - localhost
      secretName: diabetes-tls-cert
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: diabetes-frontend-service
                port:
                  number: 80
