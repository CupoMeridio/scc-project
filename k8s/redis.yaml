# FILE: k8s/redis.yaml
# RUOLO: Coda asincrona Redis 7.4 con TLS interno obbligatorio (`port 0`, `tls-port 6379`)
#        e ACL separata: utente `revocation_ro` in sola lettura sui soli prefissi `revoked:*` (V1/Q2).

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: default
  labels:
    app: diabetes-redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diabetes-redis
  namespace: default
  labels:
    app: diabetes-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: diabetes-redis
  template:
    metadata:
      labels:
        app: diabetes-redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
          command:
            - sh
            - -c
            - |
              umask 077
              cat > /data/redis.conf <<EOF
              port 0
              tls-port 6379
              tls-cert-file /etc/redis-tls/tls.crt
              tls-key-file /etc/redis-tls/tls.key
              tls-ca-cert-file /etc/internal-ca/ca.crt
              tls-auth-clients no
              appendonly yes
              appendfsync everysec
              dir /data
              maxmemory 96mb
              maxmemory-policy noeviction
              user default on >${REDIS_PASSWORD} ~* &* +@all
              user revocation_ro on >${REDIS_REVOCATION_PASSWORD} -@all +ping +get +mget ~revoked:*
              EOF
              exec redis-server /data/redis.conf
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_REVOCATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secrets
                  key: REDIS_REVOCATION_PASSWORD
          ports:
            - containerPort: 6379
              name: redis-tls
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-tls
              mountPath: /etc/redis-tls
              readOnly: true
            - name: internal-ca
              mountPath: /etc/internal-ca
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "250m"
              memory: "192Mi"
          readinessProbe:
            exec:
              command: ["sh", "-c", 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --tls --cacert /etc/internal-ca/ca.crt -h 127.0.0.1 ping | grep -q PONG']
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --tls --cacert /etc/internal-ca/ca.crt -h 127.0.0.1 ping | grep -q PONG']
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
        - name: redis-tls
          secret:
            secretName: redis-internal-tls
        - name: internal-ca
          configMap:
            name: internal-ca
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: default
  labels:
    app: diabetes-redis
spec:
  type: ClusterIP
  selector:
    app: diabetes-redis
  ports:
    - name: redis-tls
      port: 6379
      targetPort: 6379
