# FILE: k8s/seed-job.yaml
# RUOLO: Job Kubernetes dedicato alle migrazioni Alembic, creazione delle viste di sicurezza
#        e assegnazione permessi ai 6 ruoli gestiti da CloudNativePG (`managed.roles`, V8).

apiVersion: batch/v1
kind: Job
metadata:
  name: diabetes-saas-seed
  namespace: default
  labels:
    app: diabetes-saas-seed
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: diabetes-saas-seed
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: diabetes-saas-api:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "saas_app.seed_cli"]
          env:
            - name: SAAS_ENV
              value: "production"
            - name: RUN_DEMO_SEED
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: migrator-secrets
                  key: MIGRATOR_DATABASE_URL
            - name: TRAINING_PSEUDO_SALT
              valueFrom:
                secretKeyRef:
                  name: migrator-secrets
                  key: TRAINING_PSEUDO_SALT
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: pg-ca
              mountPath: /etc/pg-ca
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
      volumes:
        - name: pg-ca
          secret:
            secretName: diabetes-pg-ca
            items:
              - key: ca.crt
                path: ca.crt
