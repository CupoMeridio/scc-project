# FILE: k8s/seed-demo-job.yaml
# RUOLO: Job one-shot OPT-IN per il caricamento dei dati demo OhioT1DM da volume montato (D1).

apiVersion: batch/v1
kind: Job
metadata:
  name: diabetes-saas-demo
  namespace: default
  labels:
    app: diabetes-saas-seed
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: diabetes-saas-seed
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed-demo
          image: diabetes-saas-api:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "saas_app.seed_cli"]
          env:
            - name: SAAS_ENV
              value: "production"
            - name: RUN_DEMO_SEED
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: migrator-secrets
                  key: MIGRATOR_DATABASE_URL
            - name: TRAINING_PSEUDO_SALT
              valueFrom:
                secretKeyRef:
                  name: migrator-secrets
                  key: TRAINING_PSEUDO_SALT
            - name: DEMO_PATIENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-credentials
                  key: DEMO_PATIENT_PASSWORD
            - name: DEMO_DOCTOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-credentials
                  key: DEMO_DOCTOR_PASSWORD
            - name: DEMO_MANAGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-credentials
                  key: DEMO_MANAGER_PASSWORD
            - name: DATASET_DIR
              value: "/mnt/ohiot1dm"
          volumeMounts:
            - name: ohiot1dm-dataset
              mountPath: /mnt/ohiot1dm
              readOnly: true
            - name: pg-ca
              mountPath: /etc/pg-ca
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
      volumes:
        - name: ohiot1dm-dataset
          hostPath:
            path: /mnt/ohiot1dm
            type: Directory
        - name: pg-ca
          secret:
            secretName: diabetes-pg-ca
            items:
              - key: ca.crt
                path: ca.crt
