# FILE: k8s/saas-deployment.yaml
# RUOLO: Backend SaaS applicativo (IAM, Paziente, Diabetologo, Manager, CGM Ingestion) — 2 repliche HA.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: diabetes-saas-api
  namespace: default
  labels:
    app: diabetes-saas-api
    tier: backend-saas
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: diabetes-saas-api
  template:
    metadata:
      labels:
        app: diabetes-saas-api
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - diabetes-saas-api
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: saas-api
          image: diabetes-saas-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: PORT
              value: "8001"
            - name: HOST
              value: "0.0.0.0"
            - name: SAAS_ENV
              value: "production"
            - name: COOKIE_SECURE
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: saas-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: saas-secrets
                  key: JWT_SECRET_KEY
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: saas-secrets
                  key: REDIS_URL
            - name: ML_SERVICE_URL
              value: "http://diabetes-forecasting-service"
            - name: ML_HEADLESS_HOST
              value: "diabetes-forecasting-headless"
            - name: ML_METRICS_PORT
              value: "8000"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /api/ready
              port: 8001
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: tmp-volume
          emptyDir: {}
