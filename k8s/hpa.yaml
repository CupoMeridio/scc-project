# FILE: k8s/hpa.yaml
# RUOLO: Automated Scaling Listener (attach/arch.pdf + V8) per tutti i servizi online.

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: diabetes-forecasting-hpa
  namespace: default
  labels:
    app: diabetes-forecasting-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: diabetes-forecasting-api
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
