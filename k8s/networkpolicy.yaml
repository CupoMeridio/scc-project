# FILE: k8s/networkpolicy.yaml
# RUOLO: Isolamento perimetrale per zona (DMZ, Identity, Application, Data, Training).
#        default-deny globale + allowlist esplicita su porte e servizi effettivamente usati.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: default
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: default
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - diabetes-iam-api
          - diabetes-clinical-api
          - diabetes-manager-api
          - diabetes-ingest-api
          - diabetes-ingestion-worker
          - diabetes-saas-seed
          - diabetes-pg-backup
          - diabetes-model-trainer
          - diabetes-forecasting-api
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: diabetes-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
# Identity Zone: raggiungibile SOLO da Ingress (/api/auth) e da clinical (provisioning 2-step).
# Il servizio manager NON può raggiungere IAM (V1).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iam-api-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: diabetes-iam-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: diabetes-clinical-api
      ports:
        - protocol: TCP
          port: 8001
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: diabetes-pg
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: diabetes-redis
      ports:
        - protocol: TCP
          port: 6379
---
# Application Zone — Paziente & Diabetologo: chiama IAM (solo provisioning), ML (/predict), PG e Redis revoca RO.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clinical-api-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: diabetes-clinical-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8001
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: diabetes-iam-api
      ports:
        - protocol: TCP
          port: 8001
    - to:
        - podSelector:
            matchLabels:
              app: diabetes-forecasting-api
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: diabetes-pg
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: diabetes-redis
      ports:
        - protocol: TCP
          port: 6379
---
# Application Zone — Center Manager: SOLO metriche ML + viste aggregate PG + Redis revoca RO. ZERO IAM (V1).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: manager-api-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: diabetes-manager-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8001
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: diabetes-forecasting-api
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: diabetes-pg
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: diabetes-redis
      ports:
        - protocol: TCP
          port: 6379
---
# DMZ Ingest interno: NON raggiungibile da ingress-nginx; accoda solo su Redis + verifica device su PG.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingest-api-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: diabetes-ingest-api
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: diabetes-pg
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: diabetes-redis
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ml-api-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: diabetes-forecasting-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: diabetes-clinical-api
        - podSelector:
            matchLabels:
              app: diabetes-manager-api
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: diabetes-model-repo
      ports:
        - protocol: TCP
          port: 8002
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-repo-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: diabetes-model-repo
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: diabetes-forecasting-api
        - podSelector:
            matchLabels:
              app: diabetes-model-trainer
      ports:
        - protocol: TCP
          port: 8002
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: diabetes-redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: diabetes-iam-api
        - podSelector:
            matchLabels:
              app: diabetes-clinical-api
        - podSelector:
            matchLabels:
              app: diabetes-manager-api
        - podSelector:
            matchLabels:
              app: diabetes-ingest-api
        - podSelector:
            matchLabels:
              app: diabetes-ingestion-worker
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingestion-worker-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: diabetes-ingestion-worker
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: diabetes-redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: diabetes-pg
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seed-job-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: diabetes-saas-seed
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: diabetes-pg
      ports:
        - protocol: TCP
          port: 5432
---
# Training Zone (CronJob): ingresso negato, uscita solo verso PG (vista pseudonimizzata),
# Model Repository (publish) e kube-apiserver (rollout restart di diabetes-forecasting-api).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trainer-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: diabetes-model-trainer
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: diabetes-pg
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: diabetes-model-repo
      ports:
        - protocol: TCP
          port: 8002
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 172.18.0.0/16
      ports:
        - protocol: TCP
          port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ha-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: diabetes-pg
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: diabetes-iam-api
        - podSelector:
            matchLabels:
              app: diabetes-clinical-api
        - podSelector:
            matchLabels:
              app: diabetes-manager-api
        - podSelector:
            matchLabels:
              app: diabetes-ingest-api
        - podSelector:
            matchLabels:
              app: diabetes-ingestion-worker
        - podSelector:
            matchLabels:
              app: diabetes-saas-seed
        - podSelector:
            matchLabels:
              app: diabetes-pg-backup
        - podSelector:
            matchLabels:
              app: diabetes-model-trainer
        - podSelector:
            matchLabels:
              cnpg.io/cluster: diabetes-pg
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
        - podSelector:
            matchLabels:
              cnpg.io/cluster: diabetes-pg
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: diabetes-pg
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Instance manager CNPG -> kube-apiserver (verificati da scripts/verify_netpol.sh).
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 172.18.0.0/16
      ports:
        - protocol: TCP
          port: 6443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pg-backup-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: diabetes-pg-backup
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: diabetes-pg
      ports:
        - protocol: TCP
          port: 5432
