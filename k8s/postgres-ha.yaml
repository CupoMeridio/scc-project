# FILE: k8s/postgres-ha.yaml
# RUOLO: Data Zone HA — Cluster PostgreSQL 16 replicato (1 Primary + 1 Standby con failover automatico) via CloudNativePG.
#        I 6 ruoli applicativi minimi sono gestiti dichiarativamente con `managed.roles`:
#        saas_migrator NON possiede CREATEROLE (V8).

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: diabetes-pg
  namespace: default
  labels:
    zone: data
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  primaryUpdateStrategy: unsupervised
  stopDelay: 15
  switchoverDelay: 15
  minSyncReplicas: 1
  maxSyncReplicas: 1
  bootstrap:
    initdb:
      database: diabetes_saas
      owner: saas_migrator
      secret:
        name: saas-pg-auth
  managed:
    roles:
      - name: saas_iam
        login: true
        ensure: present
        passwordSecret:
          name: pg-role-iam
      - name: saas_clinical
        login: true
        ensure: present
        passwordSecret:
          name: pg-role-clinical
      - name: saas_manager
        login: true
        ensure: present
        passwordSecret:
          name: pg-role-manager
      - name: saas_ingest
        login: true
        ensure: present
        passwordSecret:
          name: pg-role-ingest
      - name: saas_worker
        login: true
        ensure: present
        passwordSecret:
          name: pg-role-worker
      - name: saas_trainer
        login: true
        ensure: present
        passwordSecret:
          name: pg-role-trainer
  storage:
    size: 1Gi
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1500m"
      memory: "768Mi"
